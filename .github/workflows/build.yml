name: Build LineageOS 22.1

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build LineageOS
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'adopt'

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop openjdk-11-jdk python3 python3-pip rsync unzip x11proto-core-dev xsltproc zip zlib1g-dev

    - name: Set up repo tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo 'export PATH=~/bin:$PATH' >> ~/.bashrc
        source ~/.bashrc

    - name: Sync LineageOS source
      run: |
        mkdir -p ~/lineageos
        cd ~/lineageos
        repo init -u https://github.com/LineageOS/android.git -b lineage-22.1
        repo sync -j$(nproc --all)

    - name: Prepare environment
      run: |
        cd ~/lineageos
        source build/envsetup.sh
        lunch lineage_<device>-userdebug

    - name: Build LineageOS
      run: |
        cd ~/lineageos
        make -j$(nproc --all) bacon

    - name: Upload build artifacts
      uses: softprops/action-gh-release@v2
      with:
        name: lineageos-build
        path: ~/lineageos/out/target/product/<device>/lineage-*.zip
